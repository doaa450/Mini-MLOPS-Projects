[project]
name = "prodml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "doaa450", email = "doaa75644@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff",
    "black",
    "pre-commit",
]

[tool.ruff]
extend-exclude = ["notebooks"]



[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
